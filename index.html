<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>Richyocd — Sản phẩm mình đang dùng</title>
<link rel="preconnect" href="https://down-vn.img.susercontent.com" crossorigin>
<style>
  :root{--bg:#0b0b0c;--card:#151517;--card-hi:#1c1c1f;--line:#2a2a2e;--fg:#f5f5f7;
        --dim:#a1a1aa;--ring:#ffd400}
  *{box-sizing:border-box}
  html{color-scheme:dark;scroll-padding-top:84px}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       -webkit-font-smoothing:antialiased;touch-action:manipulation;
       -webkit-tap-highlight-color:transparent}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
  main{max-width:1000px;margin:0 auto;padding:28px 20px calc(64px + env(safe-area-inset-bottom))}

  header{display:flex;align-items:center;gap:18px;margin-bottom:26px}
  header img{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#26262a;flex:none}
  .name{font:700 27px/1.1 "Brush Script MT","Segoe Script",cursive;margin:0 0 10px;text-wrap:balance}
  .social{display:flex;gap:8px;margin-left:-6px}
  .social a{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
            color:var(--fg);opacity:.85;transition:opacity .15s,background-color .15s}
  .social a:hover{opacity:1;background:#202024}
  .social svg{width:23px;height:23px;display:block}

  nav{position:sticky;top:0;z-index:2;display:flex;gap:10px;background:var(--bg);
      padding:12px 0 16px;margin:0 0 6px}
  nav button{flex:1;min-height:48px;padding:12px 6px;border-radius:12px;
      border:1px solid var(--line);background:linear-gradient(180deg,#1e1e22,#141416);
      color:var(--dim);font-family:inherit;font-size:15.5px;font-weight:700;line-height:1;
      letter-spacing:.01em;cursor:pointer;
      transition:color .15s,border-color .15s,background-image .15s,box-shadow .15s}
  nav button:hover{color:var(--fg);border-color:#3d3d44;background-image:linear-gradient(180deg,#2a2a2f,#1c1c20)}
  nav button[aria-selected="true"]{color:#231000;border-color:transparent;
      background-color:#ff6a1f;
      background-image:
        radial-gradient(circle at 18% 24%, #ffd08a 0%, transparent 62%),
        radial-gradient(circle at 82% 18%, #ff3d00 0%, transparent 66%),
        radial-gradient(circle at 72% 84%, #ff9500 0%, transparent 60%),
        radial-gradient(circle at 22% 88%, #e63312 0%, transparent 64%);
      background-size:120% 120%,150% 150%,135% 135%,165% 165%;
      background-position:0% 0%,100% 0%,100% 100%,0% 100%;
      animation:mesh 7s ease-in-out infinite;
      box-shadow:0 4px 18px rgba(238,77,45,.35)}
  @keyframes mesh{
    0%,100%{background-position:0% 0%,100% 0%,100% 100%,0% 100%}
    50%    {background-position:100% 100%,0% 100%,0% 0%,100% 0%}
  }

  #products-panel{display:grid;gap:12px;
      grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  @media(max-width:420px){#products-panel{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}

  .card{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);
        border-radius:14px;overflow:hidden;text-decoration:none;
        transition:transform .18s,border-color .18s,background-color .18s}
  .card:hover{transform:translateY(-3px);border-color:#45454d;background:var(--card-hi)}
  .card .thumb{aspect-ratio:1;background:#1e1e21;overflow:hidden}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .txt{padding:10px 11px 12px;min-width:0}
  .card .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
           overflow-wrap:anywhere;font-size:14px;font-weight:650;line-height:1.35}
  .card .s{display:block;margin-top:4px;color:var(--dim);font-size:12.5px;line-height:1.35;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .empty{padding:40px 4px;color:#7c7c85;font-size:15.5px}
  footer{margin-top:32px;text-align:center;color:#7c7c85;font-size:13.5px}

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="avatar.png" width="76" height="76" alt="Ảnh đại diện Richyocd" fetchpriority="high"
         onerror="this.onerror=null;this.src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='">
    <div>
      <h1 class="name" translate="no">Richyocd</h1>
      <div class="social">
        <a href="https://instagram.com/richyocd" target="_blank" rel="noopener" aria-label="Instagram của Richyocd">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="mailto:hello@example.com" aria-label="Gửi email cho Richyocd">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="4.5" width="20" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
        </a>
      </div>
    </div>
  </header>

  <nav id="tabs" role="tablist" aria-label="Danh mục sản phẩm"></nav>
  <div id="products-panel" role="tabpanel" aria-label="Danh sách sản phẩm" aria-live="polite"></div>
  <footer>Basic clothing aims for minimalism&nbsp;♥</footer>
</main>

<script src="products.js"></script>
<script>
  const TABS = [["ao","Áo"],["quan","Quần"],["fullset","Fullset"]];
  const $tabs = document.getElementById('tabs'), $grid = document.getElementById('products-panel');
  const PRODUCTS = window.PRODUCTS || [];
  const wanted = new URLSearchParams(location.search).get('c');
  let cur = TABS.some(([id]) => id === wanted) ? wanted
          : (TABS.find(([id]) => PRODUCTS.some(p => p.c === id)) || TABS[0])[0];

  TABS.forEach(([id,label])=>{
    const b = document.createElement('button');
    b.textContent = label; b.dataset.id = id;
    b.type = 'button';
    b.setAttribute('role','tab');
    b.setAttribute('aria-controls','products-panel');
    b.onclick = ()=>{ cur = id; history.replaceState(null, '', '?c=' + id); render(); };
    $tabs.append(b);
  });

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function render(){
    [...$tabs.children].forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === cur)));
    const list = PRODUCTS.filter(p => p.c === cur);
    $grid.innerHTML = list.map((p,idx) => `
      <a class="card" href="${esc(p.l)}" target="_blank" rel="noopener sponsored">
        <div class="thumb"><img loading="${idx ? 'lazy' : 'eager'}" ${idx ? '' : 'fetchpriority="high" '}decoding="async"
             referrerpolicy="no-referrer" width="800" height="800"
             src="${esc(p.i || '')}" alt="${esc(p.t || 'Ảnh sản phẩm')}"></div>
        <div class="txt">
          <span class="t">${esc(p.t || 'Sản phẩm')}</span>
          ${p.s ? `<span class="s">${esc(p.s)}</span>` : ''}
        </div>
      </a>`).join('') || '<p class="empty">Chưa có sản phẩm trong mục này…</p>';
  }
  render();
</script>
</body>
</html>
