<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Richyocd</title>
<style>
  :root{--bg:#000;--card:#141414;--line:#2a2a2a;--fg:#fff;--dim:#9a9a9a;--brand:#ffd400}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:960px;margin:0 auto;padding:24px 16px 60px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  header img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#222}
  .name{font:700 22px/1 "Brush Script MT",cursive;margin:0 0 6px}
  .social{display:flex;gap:10px}
  .social a{color:var(--fg);opacity:.9}
  .social svg{width:20px;height:20px;display:block}
  nav{position:sticky;top:0;z-index:2;display:flex;gap:8px;background:var(--bg);
      padding:10px 0 14px;margin-bottom:4px}
  nav button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);
      background:var(--card);color:var(--dim);font:600 14px/1 inherit;cursor:pointer}
  nav button.on{background:var(--brand);border-color:var(--brand);color:#000}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:640px){#grid{grid-template-columns:repeat(2,1fr)}}
  .card{position:relative;display:block;background:var(--card);border:1px solid var(--line);
        border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}
  .card .thumb{aspect-ratio:1;background:#1e1e1e}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .txt{padding:10px 11px 12px}
  .card b{display:block;font-size:13.5px;font-weight:600;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card s{display:block;text-decoration:none;color:var(--dim);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{position:absolute;top:0;right:0;background:var(--brand);color:#000;
         font:700 13px/1 inherit;padding:8px 9px;border-bottom-left-radius:10px;text-align:center}
  .badge em{display:block;font-size:9px;font-style:normal;font-weight:600}
  footer{margin-top:26px;text-align:center;color:#555;font-size:12px}
</style>
</head>
<body>
<main>
  <header>
    <img src="avatar.jpg" alt="" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E'">
    <div>
      <h1 class="name">Richyocd</h1>
      <div class="social">
        <a href="https://instagram.com/richyocd" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="mailto:hello@example.com" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4.5" width="20" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
        </a>
      </div>
    </div>
  </header>

  <nav id="tabs"></nav>
  <div id="grid"></div>
  <footer>Mua qua link này để ủng hộ mình nhé</footer>
</main>

<script src="products.js"></script>
<script>
  const TABS = [["ao","Áo"],["quan","Quần"],["fullset","Fullset"]];
  const $tabs = document.getElementById('tabs'), $grid = document.getElementById('grid');
  let cur = (TABS.find(([id]) => (window.PRODUCTS || []).some(p => p.c === id)) || TABS[0])[0];

  TABS.forEach(([id,label])=>{
    const b = document.createElement('button');
    b.textContent = label; b.dataset.id = id;
    b.onclick = ()=>{ cur = id; render(); };
    $tabs.append(b);
  });

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function render(){
    [...$tabs.children].forEach(b => b.classList.toggle('on', b.dataset.id === cur));
    const list = (window.PRODUCTS || []).filter(p => p.c === cur);
    $grid.innerHTML = list.map(p => `
      <a class="card" href="${esc(p.l)}" target="_blank" rel="noopener sponsored">
        <div class="thumb"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(p.i || '')}" alt=""></div>
        ${p.d ? `<div class="badge">${esc(p.d)}%<em>Giảm</em></div>` : ''}
        <div class="txt"><b>${esc(p.t || '')}</b>${p.s ? `<s>${esc(p.s)}</s>` : ''}</div>
      </a>`).join('') || '<p style="color:#666">Chưa có sản phẩm.</p>';
  }
  render();
</script>
</body>
</html>
