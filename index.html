<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12100c">
<title>Richyocd · Sản phẩm mình đang dùng</title>
<link rel="preconnect" href="https://down-vn.img.susercontent.com" crossorigin>
<style>
  :root{--bg:#0b0b0c;--card:#151517;--card-hi:#1c1c1f;--line:#2a2a2e;--fg:#f5f5f7;
        --dim:#a1a1aa;--ring:#ffd400;
        --mesh:radial-gradient(circle at 18% 24%, #ffcc80 0%, transparent 62%),
               radial-gradient(circle at 82% 18%, #ffa726 0%, transparent 66%),
               radial-gradient(circle at 72% 84%, #fb8c00 0%, transparent 60%),
               radial-gradient(circle at 22% 88%, #ef6c00 0%, transparent 64%);
        --mesh-size:120% 120%,150% 150%,135% 135%,165% 165%;
        --mesh-text:radial-gradient(circle at 18% 24%, #ffd9a6 0%, transparent 62%),
                    radial-gradient(circle at 82% 18%, #ffb74d 0%, transparent 66%),
                    radial-gradient(circle at 72% 84%, #ff9800 0%, transparent 60%),
                    radial-gradient(circle at 22% 88%, #fb8c00 0%, transparent 64%)}
  *{box-sizing:border-box}
  html{color-scheme:dark;scroll-padding-top:84px}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       -webkit-font-smoothing:antialiased;touch-action:manipulation;
       -webkit-tap-highlight-color:transparent}
  /* Ambient layer: 3 khoi radial-gradient troi lech nhau. Chi animate transform
     (compositor) - khong dung filter:blur de do nang GPU tren mobile. */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
      transform:translateZ(0);
      background:radial-gradient(140% 90% at 50% -20%,#17110a 0%,transparent 62%)}
  .bg i{position:absolute;display:block;width:78vmax;height:78vmax;border-radius:50%;
        will-change:transform;animation:drift 38s ease-in-out infinite}
  .bg i:nth-child(1){top:-30vmax;left:-26vmax;animation-duration:38s;
      background:radial-gradient(circle,rgba(251,140,0,.20) 0%,rgba(251,140,0,.07) 34%,transparent 68%)}
  .bg i:nth-child(2){bottom:-34vmax;right:-30vmax;animation-duration:46s;animation-direction:reverse;
      background:radial-gradient(circle,rgba(239,108,0,.17) 0%,rgba(239,108,0,.06) 36%,transparent 70%)}
  .bg i:nth-child(3){top:24%;left:36%;width:62vmax;height:62vmax;animation-duration:54s;
      background:radial-gradient(circle,rgba(255,217,166,.10) 0%,transparent 66%)}
  /* Vignette de chu khong bi loang mau o ria man hinh */
  .bg::after{content:"";position:absolute;inset:0;
      background:radial-gradient(130% 100% at 50% 0%,transparent 38%,rgba(0,0,0,.66) 100%)}
  @keyframes drift{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    33%    {transform:translate3d(9%,7%,0) scale(1.10)}
    66%    {transform:translate3d(-7%,11%,0) scale(1.05)}
  }
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
  main{max-width:1000px;margin:0 auto;padding:28px 20px calc(64px + env(safe-area-inset-bottom))}

  header{display:flex;align-items:center;gap:18px;margin-bottom:26px}
  header img{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#26262a;flex:none}
  .name{font:700 27px/1.1 "Brush Script MT","Segoe Script",cursive;margin:0 0 10px;text-wrap:balance}
  .social{display:flex;gap:8px;margin-left:-6px}
  .social a{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
            color:var(--fg);opacity:.85;transition:opacity .15s,background-color .15s}
  .social a:hover{opacity:1;background:#202024}
  .social svg{width:23px;height:23px;display:block}

  nav{position:sticky;top:0;z-index:2;display:flex;gap:10px;
      background:rgba(11,11,12,.82);backdrop-filter:blur(14px) saturate(130%);
      -webkit-backdrop-filter:blur(14px) saturate(130%);
      padding:12px 0 16px;margin:0 0 6px}
  nav button{flex:1;min-height:44px;padding:10px 6px;border-radius:12px;
      border:1px solid var(--line);background:linear-gradient(180deg,#1e1e22,#141416);
      color:var(--dim);font-family:inherit;font-size:15px;font-weight:700;line-height:1;
      letter-spacing:.01em;cursor:pointer;
      transition:color .15s,border-color .15s,background-image .15s,box-shadow .15s}
  nav button:hover{color:var(--fg);border-color:#3d3d44;background-image:linear-gradient(180deg,#2a2a2f,#1c1c20)}
  nav button[aria-selected="true"]{color:#231000;border-color:transparent;
      background-color:#fb8c00;background-image:var(--mesh);background-size:var(--mesh-size);
      background-position:0% 0%,100% 0%,100% 100%,0% 100%;
      animation:mesh 7s ease-in-out infinite;
      box-shadow:0 4px 18px rgba(251,140,0,.32)}
  @keyframes mesh{
    0%,100%{background-position:0% 0%,100% 0%,100% 100%,0% 100%}
    50%    {background-position:100% 100%,0% 100%,0% 0%,100% 0%}
  }

  /* Chữ + logo ngoài tab dùng chung mesh gradient cam, cắt theo hình chữ */
  .grad{color:#ff8a2b}
  @supports ((background-clip:text) or (-webkit-background-clip:text)){
    .grad{background-image:var(--mesh-text);background-size:var(--mesh-size);
          background-position:0% 0%,100% 0%,100% 100%,0% 100%;
          -webkit-background-clip:text;background-clip:text;
          color:transparent;-webkit-text-fill-color:transparent}
    /* chỉ vài phần tử chạy animation; card giữ tĩnh cho nhẹ máy */
    .grad--anim{animation:mesh 7s ease-in-out infinite}
  }
  /* icon social lấy gradient qua <linearGradient> trong SVG */
  .social svg stop:first-of-type{animation:stopA 7s ease-in-out infinite}
  .social svg stop:last-of-type{animation:stopB 7s ease-in-out infinite}
  @keyframes stopA{0%,100%{stop-color:#ffd9a6}50%{stop-color:#ffb74d}}
  @keyframes stopB{0%,100%{stop-color:#fb8c00}50%{stop-color:#ff9800}}

  #products-panel{display:grid;gap:12px;
      grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  @media(max-width:420px){#products-panel{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}

  .bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 12px}
  .bar label{color:var(--dim);font-size:13px}
  .bar select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;
      padding:8px 10px;font-family:inherit;font-size:13.5px;font-weight:600;line-height:1;
      min-height:44px;cursor:pointer;transition:border-color .15s,background-color .15s}
  .bar select:hover{border-color:#3d3d44;background:var(--card-hi)}

  /* iPhone: thu nho tab + gian cach. Tab giu min 44px theo Apple HIG. */
  @media(max-width:640px){
    main{padding:20px 14px calc(48px + env(safe-area-inset-bottom))}
    header{gap:14px;margin-bottom:20px}
    header img{width:64px;height:64px}
    .name{font-size:24px;margin-bottom:8px}
    .social a{width:42px;height:42px}
    nav{gap:7px;padding:8px 0 10px}
    nav button{min-height:44px;padding:8px 4px;font-size:13.5px;border-radius:12px;letter-spacing:0}
    .bar{gap:6px;margin-bottom:10px}
    .bar label{font-size:12px}
    .bar select{padding:7px 9px;font-size:13px}
    .card .t{font-size:13.5px}
    /* vmax lon hon tren man hep -> giam do dam cho khoi choi */
    .bg i{opacity:.72}
  }

  .card{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);
        border-radius:14px;overflow:hidden;text-decoration:none;
        transition:transform .18s,border-color .18s,background-color .18s}
  .card:hover{transform:translateY(-3px);border-color:#45454d;background:var(--card-hi)}
  .card .thumb{position:relative;aspect-ratio:1;background:#1e1e21;overflow:hidden}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .sold{position:absolute;left:7px;bottom:7px;padding:3px 8px;border-radius:999px;
              background:rgba(0,0,0,.66);color:#fff;font-size:11px;font-weight:600;
              letter-spacing:.01em;backdrop-filter:blur(4px)}
  .card .txt{padding:10px 11px 12px;min-width:0}
  .card .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
           overflow-wrap:anywhere;font-size:14px;font-weight:650;line-height:1.35}

  .empty{padding:40px 4px;color:#7c7c85;font-size:15.5px}
  footer{margin-top:32px;text-align:center;color:#7c7c85;font-size:13.5px}

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <header>
    <img src="avatar.png" width="76" height="76" alt="Ảnh đại diện Richyocd" fetchpriority="high"
         onerror="this.onerror=null;this.src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='">
    <div>
      <h1 class="name grad grad--anim" translate="no">Richyocd</h1>
      <div class="social">
        <a href="https://instagram.com/richyocd" target="_blank" rel="noopener" aria-label="Instagram của Richyocd">
          <svg viewBox="0 0 24 24" fill="none" stroke="url(#gIg)" stroke-width="1.8" aria-hidden="true"><defs><linearGradient id="gIg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9a6"/><stop offset=".5" stop-color="#ffb74d"/><stop offset="1" stop-color="#fb8c00"/></linearGradient></defs><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.2" fill="url(#gIg)" stroke="none"/></svg>
        </a>
        <a href="mailto:hello@example.com" aria-label="Gửi email cho Richyocd">
          <svg viewBox="0 0 24 24" fill="none" stroke="url(#gMail)" stroke-width="1.8" aria-hidden="true"><defs><linearGradient id="gMail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9a6"/><stop offset=".5" stop-color="#ffb74d"/><stop offset="1" stop-color="#fb8c00"/></linearGradient></defs><rect x="2" y="4.5" width="20" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
        </a>
      </div>
    </div>
  </header>

  <nav id="tabs" role="tablist" aria-label="Danh mục sản phẩm"></nav>
  <div class="bar">
    <label for="sort">Sắp xếp</label>
    <select id="sort">
      <option value="sold">Bán chạy</option>
      <option value="new">Mới thêm</option>
      <option value="az">Tên A→Z</option>
    </select>
  </div>
  <div id="products-panel" role="tabpanel" aria-label="Danh sách sản phẩm" aria-live="polite"></div>
  <footer class="grad grad--anim">Basic clothing aims for minimalism&nbsp;♥</footer>
</main>

<script>
  const TABS = [["ao","Áo"],["quan","Quần"],["fullset","Fullset"]];
  const $tabs = document.getElementById('tabs'), $grid = document.getElementById('products-panel');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // products.csv: id,cat,title,img,link,sold  (co quote khi o chua dau phay)
  const parseCSV = txt => {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < txt.length; i++) {
      const ch = txt[i];
      if (q) {
        if (ch === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += ch;
      }
      else if (ch === '"') q = true;
      else if (ch === ',') { row.push(f); f = ''; }
      else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (ch !== '\r') f += ch;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    const head = rows.shift().map(h => h.trim());
    return rows.filter(r => r.some(v => v.trim() !== '')).map(r => {
      const o = {}; head.forEach((h, i) => o[h] = (r[i] ?? '').trim());
      return { c:o.cat, t:o.title, i:o.img, l:o.link, sold:o.sold };
    });
  };

  // Title Case cho tên sản phẩm. Giữ nguyên viết hoa của mã/từ viết tắt.
  const KEEP = new Set(['gsm','xl','xxl','xxxl','xs','nb']);
  const capFirst = p => {
    const i = p.search(/\p{L}/u);
    return i < 0 ? p : p.slice(0, i) + p[i].toUpperCase() + p.slice(i + 1).toLowerCase();
  };
  const titleCase = s => String(s || '').trim().split(/\s+/).map(w => {
    const core = w.replace(/[^\p{L}\p{N}]/gu, '');
    if (core && core === core.toUpperCase() && /\d/.test(core)) return w;          // 280GSM
    if (KEEP.has(core.toLowerCase())) return w.replace(/\p{L}/gu, c => c.toUpperCase());
    return w.split('-').map(capFirst).join('-');
  }).join(' ');

  let PRODUCTS = [], cur = TABS[0][0], sort = 'sold';

  // "30k+" -> 30000, "1tr+" -> 1000000, "142" -> 142, "" -> 0
  const parseSold = s => {
    const m = String(s || '').match(/([\d.,]+)\s*(tr|k)?/i);
    if (!m) return 0;
    const n = parseFloat(m[1].replace(/\./g, '').replace(',', '.'));
    if (!isFinite(n)) return 0;
    const u = (m[2] || '').toLowerCase();
    return u === 'tr' ? n * 1e6 : u === 'k' ? n * 1e3 : n;
  };

  const syncURL = () => {
    const q = new URLSearchParams();
    q.set('c', cur); q.set('sort', sort);
    history.replaceState(null, '', '?' + q);
  };

  TABS.forEach(([id,label])=>{
    const b = document.createElement('button');
    b.textContent = label; b.dataset.id = id;
    b.type = 'button';
    b.setAttribute('role','tab');
    b.setAttribute('aria-controls','products-panel');
    b.onclick = ()=>{ cur = id; syncURL(); render(); };
    $tabs.append(b);
  });

  const $sort = document.getElementById('sort');
  $sort.onchange = ()=>{ sort = $sort.value; syncURL(); render(); };

  function render(){
    [...$tabs.children].forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === cur)));
    const list = PRODUCTS.filter(p => p.c === cur);
    if (sort === 'sold') list.sort((a, b) => parseSold(b.sold) - parseSold(a.sold));
    else if (sort === 'az') list.sort((a, b) => (a.t || '').localeCompare(b.t || '', 'vi'));
    $grid.innerHTML = list.map((p,idx) => `
      <a class="card" href="${esc(p.l)}" target="_blank" rel="noopener sponsored">
        <div class="thumb">
          <img loading="${idx ? 'lazy' : 'eager'}" ${idx ? '' : 'fetchpriority="high" '}decoding="async"
               referrerpolicy="no-referrer" width="800" height="800"
               src="${esc(p.i || '')}" alt="${esc(p.t || 'Ảnh sản phẩm')}">
          ${p.sold ? `<span class="sold">${esc(p.sold)} đã bán</span>` : ''}
        </div>
        <div class="txt">
          <span class="t grad">${esc(titleCase(p.t) || 'Sản phẩm')}</span>
        </div>
      </a>`).join('') || '<p class="empty grad">Chưa có sản phẩm trong mục này…</p>';
  }

  (async () => {
    $grid.innerHTML = '<p class="empty grad">Đang tải sản phẩm…</p>';
    try {
      const res = await fetch('products.csv', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      PRODUCTS = parseCSV(await res.text());
    } catch (e) {
      $grid.innerHTML = `<p class="empty">Không đọc được products.csv (${esc(e.message)})<br>Cần chạy qua http, không mở trực tiếp file://</p>`;
      return;
    }
    const q = new URLSearchParams(location.search);
    const wanted = q.get('c');
    cur = TABS.some(([id]) => id === wanted) ? wanted
        : (TABS.find(([id]) => PRODUCTS.some(p => p.c === id)) || TABS[0])[0];
    const ws = q.get('sort');
    if ([...$sort.options].some(o => o.value === ws)) { sort = ws; $sort.value = ws; }
    render();
  })();
</script>
</body>
</html>
